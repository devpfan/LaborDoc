version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labordoc-backend-dev
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=development
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - labordoc-network-dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: labordoc-frontend-dev
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - labordoc-network-dev

networks:
  labordoc-network-dev:
    driver: bridge
