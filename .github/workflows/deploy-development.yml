name: CI - Develop Branch

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Backend
      - name: Install Python dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Backend
        run: |
          cd backend
          echo "✅ Backend dependencies installed successfully"
          # Aquí puedes agregar tests cuando los tengas
          # pytest tests/

      # Frontend
      - name: Install Node dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Validate Build
        run: |
          if [ -d "frontend/dist/gestor-labor-docente-frontend" ]; then
            echo "✅ Frontend build successful"
          else
            echo "❌ Frontend build failed"
            exit 1
          fi

      # Notificación
      - name: Build Summary
        if: success()
        run: |
          echo "✅ Build and tests passed on develop branch"
          echo "📦 Ready to merge to main for production deployment"
          echo ""
          echo "To deploy to production:"
          echo "  git checkout main"
          echo "  git merge develop"
          echo "  git push origin main"
