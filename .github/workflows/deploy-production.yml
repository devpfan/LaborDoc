name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Backend
      - name: Install Python dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Backend
        run: |
          cd backend
          echo "✅ Backend validation passed"
          # pytest tests/ --cov=app

      # Frontend
      - name: Install Node dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend (Production)
        run: |
          cd frontend
          npm run build -- --configuration production

      - name: Validate Production Build
        run: |
          if [ -d "frontend/dist/gestor-labor-docente-frontend" ]; then
            echo "✅ Production build successful"
            echo "📦 Bundle size:"
            du -sh frontend/dist/gestor-labor-docente-frontend
          else
            echo "❌ Production build failed"
            exit 1
          fi

      # Deployment Success Message
      # El despliegue real lo hará Render/Railway automáticamente
      # al detectar el push a main
      
      - name: Deployment Info
        if: success()
        run: |
          echo "✅ Build successful - Ready for deployment"
          echo ""
          echo "🚀 Deployment platforms will auto-deploy:"
          echo "   - Render.com: Triggered automatically"
          echo "   - Railway.app: Triggered automatically"
          echo ""
          echo "📍 After deployment, update:"
          echo "   1. Frontend environment.prod.ts with backend URL"
          echo "   2. Backend CORS origins with frontend URL"
          echo "   3. Commit and push changes if URLs changed"
          echo ""
          echo "🌐 Check deployment status:"
          echo "   - Render: https://dashboard.render.com"
          echo "   - Railway: https://railway.app/dashboard"
